[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "taxes"
version = "1.0.0"
license = { text = "Proprietary" }
requires-python = ">=3.10"
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]

dependencies = [
    "camelot-py>=2.0.0,<3.0.0",
    "click>=8.4.1,<9.0.0",
    "opencv-python>=4.13.0.92,<5.0.0",
    "pandas>=2.3.3,<3.0.0",
]

[tool.uv]
add-bounds = "major"
override-dependencies = [
    "pypdf>=6.10.2,<7.0.0",
]

[project.optional-dependencies]
testing = [
    "freezegun>=1.5.5,<2.0.0",
    "mypy>=2.1.0,<3.0.0",
    "pandas-stubs>=2.3.3.260113,<3.0.0",
    "pyright>=1.1.409,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "python-lsp-server>=1.14.0,<2.0.0",
    "ruff>=0.15.15,<1.0.0",
    "syrupy>=5.3.1,<6.0.0",
    "ty>=0.0.40,<1.0.0",
    "types-python-dateutil>=2.9.0.20260518,<3.0.0",
    "wcmatch>=10.1,<11.0.0",
]

[project.scripts]
statements2csv = "statements2csv.__main__:main"
gt = "greptransactions.__main__:main"

[tool.mypy]
strict = true

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C",
  "D",
  "E",
  "F",
  "I",
  "N",
  "UP",
  "W",
]
# E501 - line too long; if formatter does its job, I'm not worried about the rare long line
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
addopts = [
  '--cov',
  'src',
  '--cov-report',
  'html',
  '--snapshot-default-extension',
  'tests.snapshot_extensions.CryptAwareExtension',
]
